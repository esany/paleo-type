name: source-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run shared deterministic full check
        run: python tools/check.py
      - name: Human-readable assurance boundary
        if: always()
        run: |
          {
            echo '## paleo-type source/project/engineering assurance'
            echo
            echo '- The same repository-local `python tools/check.py` entrypoint used by developers was executed.'
            echo '- It covers Source Contract validation, Engineering validation, regressions, fresh-process Project contexts and managed real-data resolver fixtures.'
            echo '- A passing workflow establishes formal/deterministic consistency for the checked invariants.'
            echo '- It does **not** by itself establish manuscript truth, specialist validity, evidential independence, target-context evidence staging/vision inspectability, Human Owner acceptance, or merge/release authority.'
          } >> "$GITHUB_STEP_SUMMARY"
