name: savesax Oppurg execution

on:
  push:
    branches:
      - run/savesax-oppurg-2026-10-05

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install intake parser dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Resolve archive metadata from the supplied record page
        env:
          PAGE_URL: "https://www.archiv.sachsen.de/archiv/bestand.jsp?guid=e741423e-c9f2-4f52-ad43-3cbbe9a7b1af&_ptabs=%7B%22%23tab-archivalie%22%3A1%7D#archivalie"
          GUID: "e741423e-c9f2-4f52-ad43-3cbbe9a7b1af"
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from bs4 import BeautifulSoup

          page_url = os.environ['PAGE_URL']
          guid = os.environ['GUID']
          req = Request(page_url, headers={'User-Agent': 'paleo-type savesax live-run/0.1'})
          with urlopen(req, timeout=60) as response:
              raw = response.read()
          soup = BeautifulSoup(raw, 'html.parser')

          def norm(s): return ' '.join(s.split())
          def value_after_label(label):
              node = soup.find(string=lambda s: s is not None and norm(s).rstrip(':') == label.rstrip(':'))
              if node is None: return None
              row = node.parent.find_parent(['tr', 'dl', 'div'])
              if row:
                  vals = [norm(x) for x in row.stripped_strings if norm(x).rstrip(':') != label.rstrip(':')]
                  if vals: return vals[0]
              all_text = [norm(x) for x in soup.stripped_strings]
              for i, item in enumerate(all_text):
                  if item.rstrip(':') == label.rstrip(':') and i + 1 < len(all_text): return all_text[i + 1]
              return None

          signature = value_after_label('Archivaliensignatur')
          date_label = value_after_label('Datierung')
          title = None
          for tag in soup.find_all(['h2','h3','h4']):
              t = norm(tag.get_text(' ', strip=True))
              if not t or t in {'Objektdetails','Gliederung des Bestandes:','Digitalisat'}: continue
              if 'Beständeübersicht' in t or 'Archivale im Bestand' in t: continue
              if len(t) >= 12:
                  title = t
                  if 'Oppurg' in t or 'Rittergut' in t: break
          if not signature or not date_label or not title:
              raise SystemExit(f'metadata parse failed: signature={signature!r}, date={date_label!r}, title={title!r}')
          metadata = {
              'archive':'Sächsisches Staatsarchiv',
              'fonds':'20578 Rittergut Wolkenburg mit Kaufungen',
              'signature':signature,
              'title':title,
              'date_label':date_label,
              'guid':guid,
              'page_url':page_url,
              'archive_code':'SStA',
              'name_key':title,
              'classification_path':'10 / 10.5 / 10.5.3 Oppurg, Knau, Grunau, Gröbitz',
              'rights_status':'unknown',
              'image_count':139,
          }
          with open('/tmp/savesax-source.json','w',encoding='utf-8') as f:
              json.dump(metadata,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(metadata,ensure_ascii=False,indent=2))
          PY

      - name: Dry-run exact plan
        run: |
          mkdir -p /tmp/savesax-out
          python tools/archival_source_acquisition.py \
            --metadata /tmp/savesax-source.json \
            --output-root /tmp/savesax-out \
            --route download \
            --dry-run > /tmp/savesax-plan.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/savesax-plan.json',encoding='utf-8'))
          assert len(p['images']) == 139
          assert p['images'][0]['filename'] == '0001.jpg'
          assert p['images'][-1]['filename'] == '0139.jpg'
          print('plan PASS:', p['package_name'], len(p['images']), p['route'])
          PY

      - name: Run admitted acquisition skill end to end
        shell: bash
        run: |
          set -euo pipefail
          python tools/archival_source_acquisition.py \
            --metadata /tmp/savesax-source.json \
            --output-root /tmp/savesax-out \
            --route download \
            --rate-limit 0 \
            > /tmp/savesax-manifest.stdout.json &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            count=$(find /tmp/savesax-out -type f -name '*.jpg' | wc -l)
            echo "acquisition progress: ${count}/139 JPEGs complete"
            sleep 20
          done
          wait "$pid"

      - name: Verify completed package
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('/tmp/savesax-out')
          packages=[p for p in root.iterdir() if p.is_dir()]
          if len(packages)!=1: raise SystemExit(f'expected one package, found {len(packages)}')
          package=packages[0]
          manifest=json.loads((package/'QUELLENINFO.json').read_text(encoding='utf-8'))
          jpgs=sorted(package.glob('*.jpg'))
          lines=[x for x in (package/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert manifest.get('status')=='complete'
          assert len(manifest.get('images',[]))==139 and len(jpgs)==139 and len(lines)==139
          assert [p.name for p in jpgs]==[f'{i:04d}.jpg' for i in range(1,140)]
          summary={
              'status':'complete','package_name':package.name,'image_count':139,
              'first_image':jpgs[0].name,'last_image':jpgs[-1].name,
              'total_image_bytes':sum(p.stat().st_size for p in jpgs),
              'sha256sums_file_sha256':hashlib.sha256((package/'SHA256SUMS.txt').read_bytes()).hexdigest(),
              'file_list_url':manifest['file_list_url'],'file_list_sha256':manifest['file_list_sha256'],
              'acquired_at_utc':manifest['acquired_at_utc'],'route':manifest['route'],'source':manifest['source'],
          }
          Path('/tmp/savesax-run-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload completed source package
        uses: actions/upload-artifact@v4
        with:
          name: savesax-e741423e-c9f2-4f52-ad43-3cbbe9a7b1af
          path: |
            /tmp/savesax-out/**
            /tmp/savesax-run-summary.json
            /tmp/savesax-plan.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
